<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App logo concepts</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f2f5;color:#17202d;font-family:system-ui,sans-serif;padding:40px}main{max-width:1020px;margin:auto}h1{font-size:30px;margin:0 0 8px}p{color:#687586}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:28px}article{background:white;border-radius:24px;padding:22px}img{width:100%;border-radius:23%;display:block}h2{font-size:18px;margin:20px 0 8px}article p{font-size:14px;line-height:1.5}.small{display:flex;align-items:center;gap:16px;margin-top:24px}.small img{width:48px}.small img:last-child{width:32px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}body{padding:24px}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style><main><h1>앱 로고 시안</h1><p>2D flat · Blue / Mint · 작은 아이콘 크기 비교</p><div class="grid"><article><a href="01-scan-frame.png"><img src="01-scan-frame.png" alt="01 · 스캔 프레임"></a><h2>01 · 스캔 프레임</h2><p>스캔 기능을 가장 직관적으로 표현</p><div class="small"><img src="01-scan-frame.png" alt="48px"><img src="01-scan-frame.png" alt="32px"></div></article><article><a href="02-folded-page.png"><img src="02-folded-page.png" alt="02 · 접힌 종이"></a><h2>02 · 접힌 종이</h2><p>민트 배경의 단순하고 또렷한 문서</p><div class="small"><img src="02-folded-page.png" alt="48px"><img src="02-folded-page.png" alt="32px"></div></article><article><a href="03-focus.png"><img src="03-focus.png" alt="03 · 포커스"></a><h2>03 · 포커스</h2><p>굵은 프레임으로 촬영과 인식 강조</p><div class="small"><img src="03-focus.png" alt="48px"><img src="03-focus.png" alt="32px"></div></article><article><a href="04-paper-stack.png"><img src="04-paper-stack.png" alt="04 · 문서 스택"></a><h2>04 · 문서 스택</h2><p>문서 정리와 다양한 도구를 표현</p><div class="small"><img src="04-paper-stack.png" alt="48px"><img src="04-paper-stack.png" alt="32px"></div></article></div></main></html>
