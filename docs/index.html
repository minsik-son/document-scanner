<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rude Finch</title>
<meta name="description" content="Rude Finch makes small, private apps for iPhone.">
<style>
  :root { color-scheme: light dark; --ink:#191f28; --sub:#4e5968; --line:#e5e8eb; --bg:#ffffff; --accent:#3182f6; }
  @media (prefers-color-scheme: dark) { :root { --ink:#f2f4f6; --sub:#b0b8c1; --line:#333d4b; --bg:#17171c; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:40px 20px 64px; }
  h1 { font-size:30px; margin:0 0 16px; } h2 { font-size:20px; margin:32px 0 8px; }
  p, li { color:var(--sub); } a { color:var(--accent); }
  .contact { border:1px solid var(--line); border-radius:16px; padding:16px 20px; }
</style>
</head>
<body>
<main>
<h1>Rude Finch</h1>
<p>Small, private apps for iPhone. Your files stay on your device.</p>

<h2>Apps</h2>
<div class="contact">
  <p><strong>HushScan</strong> — a document scanner that works offline.</p>
  <p><a href="https://apps.apple.com/app/id6820689054">App Store</a> · <a href="hushscan/support.html">Support</a> · <a href="hushscan/privacy.html">Privacy Policy</a></p>
</div>

<h2>Contact</h2>
<p><a href="mailto:support@rudefinch.com">support@rudefinch.com</a></p>
</main>
</body>
</html>
